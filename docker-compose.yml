version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: aq_edu_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      # This is just a dummy default database
      POSTGRES_DB: default_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount initialization script to auto-create multiple databases
      - ./init-scripts:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
